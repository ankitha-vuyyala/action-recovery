title: Did the Action Already Happen? Reliable Recovery for AI Agents Under Ambiguous Tool Outcomes
author:
  name: Ankitha Vuyyala
  affiliation: Independent Researcher, Louisville, Kentucky, USA
  email: ankithavuyyala08@gmail.com
  orcid: https://orcid.org/0009-0004-1916-8070
date: October 2026
keywords:
- LLM agents
- tool use
- exactly-once
- idempotency
- fault tolerance
- compensation
- durable execution
- API design
abstract: 'When a tool call made by an AI agent times out or loses its reply, the agent cannot tell whether the effect happened, did not happen, or is still on its way. The standard remedy is an idempotency key, but in a documentation census of 52 widely used write APIs, {{cen.keyless|int}} offer no server-side key on the operation an agent would call, and several keys that exist expire within hours. I argue that recovery needs *attributability*, the ability to count the standing effects of one''s own operation, and derive for each API contract and read model whether a client can achieve prevention of duplicates, convergence of the final state, or only honest abstention; any policy that must stop at a horizon has to bet between two indistinguishable worlds. Of the {{cen.keyless|int}} key-less APIs, {{cen.keyless.tag|int}} persist a client-controlled field that can be looked up. I build Settle, a recovery layer that journals each intent, stamps an operation id into such a field, resolves unknown outcomes by that id up to a horizon, and compensates only effects it can prove are surplus. Under internally frozen protocols I evaluate it on six unmodified services in containers, with injected network faults and process crashes, against ten baselines including idempotency keys, a Temporal workflow engine and a client-side guard, with a scripted agent and four language models. Across the attributable and reversible grid, Settle reduces inconsistent final states from {{abs.best_rate|pct}} for the strongest matched-latency baseline of the main study to {{abs.S_rate|pct}}; without the two fault modes that structurally require a final sweep or row-level checks, the rates are {{rb.core.Gw|pct}} and {{rb.core.S|pct}}. Durable keys are exact only where the service honours them. A follow-up study of {{fu.n.all|int}} episodes bounds the claims: a tag-based wait-then-count policy matches Settle on every ordinary fault (it is inconsistent in {{fu.h1.Sp|pct}} of these attributable and reversible worlds against Settle''s {{abs.S_rate|pct}}, with {{fu.f1.red.Sp.k|int}} of its {{fu.h1.Sp.k|int}} failures on transport redelivery), so convergence pays off mainly for duplicates the transport creates; an author filter combined with waiting rescues content checks against look-alikes from other accounts; and a frontier model without the layer fails in the same cells as smaller ones ({{fu.f7.hard.C0|pct}} of hard worlds, against {{fu.f7.hard.Snp|pct}} with Settle).'
