  Data and code availability: "The Settle implementation, the baselines, the fault-injection harness and service definitions, the API census, the frozen study protocols and analysis plans, the recorded episode outcomes and the analysis scripts are publicly available at <https://github.com/ankitha-vuyyala/action-recovery>. The artifacts corresponding to this manuscript are archived in release v1.0 at <https://github.com/ankitha-vuyyala/action-recovery/releases/tag/v1.0>. The release includes the raw-records archives. They hold the per-episode folders of all 29,394 recorded episodes: the 20,500 episodes of the main study (17,820 scripted and 2,680 language-model episodes) and the 4,272 episodes of the follow-up study, 24,772 in all, together with 4,622 episodes of development, pilot and gate-check runs, which are not part of the confirmatory or follow-up analyses. Each folder contains the configuration, dispatch and checkpoint logs, the grader reports and, for language-model episodes, the full conversation with the model. The archives also hold the response cache of the 17,171 paid model calls, whose model, token usage, cost and time are logged in the repository as well (`runs/cost_ledger.jsonl`). The evaluation records in the repository regenerate every reported number, table and figure, and the response cache replays every model decision without an API key. Third-party materials, including the service container images, remain subject to their respective licenses and attribution requirements."
